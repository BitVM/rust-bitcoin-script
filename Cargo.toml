[workspace]
members = ["macro"]

[package]
name = "bitcoin-script"
version = "0.4.0"
authors = ["Lukas George <lukas@zerosync.org>"]
edition = "2021"
description = "Inline Bitcoin scripts"
license = "MIT"
repository = "https://github.com/BitVM/rust-bitcoin-script"

[features]
serde = ["dep:serde", "bitcoin/serde"]

# Store scripts in a flat structure. Faster but potentially more memory intensive
unstructured = []

# skip the opcode validation step in compile()
unchecked = []

[dependencies]
bitcoin = { version = "0.32.5" }
script-macro = { path = "./macro" }
stdext = "0.3.3"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
bincode = "1.3.3"
