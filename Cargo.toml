[workspace]
members = ["macro"]

[package]
name = "bitcoin-script"
version = "0.4.0"
authors = ["Lukas George <lukas@zerosync.org>"]
edition = "2021"
description = "Inline Bitcoin scripts"
license = "MIT"
repository = "https://github.com/BitVM/rust-bitcoin-script"

[features]
serde = ["dep:serde", "bitcoin/serde"]

[dependencies]
bitcoin = { version = "0.32.5" }
script-macro = { path = "./macro" }
stdext = "0.3.3"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
bitcoin-scriptexec = { git = "https://github.com/BitVM/rust-bitcoin-scriptexec", rev = "b24608bff855ea8932ae236c7a04f13f730ab9f8" }
bincode = "1.3.3"
